readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2,<3.0",
    "pandas-gbq>=0.23.1,<0.24",
    "google-cloud-core>=2.4.1,<3.0",
    "google-cloud-bigquery>=3.25.0,<4.0",
    "google-cloud-secret-manager>=2.20.0,<3.0",
    "data-pipeline-tools @ git+https://github.com/tpximpact/GCP-Data-Pipelines-DX.git@v1.0.4",
    "dotenv>=0.9.9,<0.10",
]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.406,<2.0.0",
]
